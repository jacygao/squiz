name: i246 Linux probe

on:
  push:
    branches: [notes/whose-group-is-it]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: What Linux says about a recorded group
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Versions
        run: |
          uname -a; node --version; bash --version | head -1; ps --version
          echo "pid_max=$(cat /proc/sys/kernel/pid_max)"
          echo "uid=$(id -u) processes=$(ps -A | wc -l)"

      - name: Take the code under question from the pull request's branch
        run: |
          git fetch --no-tags origin reviewers/the-shell-records-its-group
          mkdir -p /tmp/p
          git show FETCH_HEAD:src/reviewers/groups.ts > /tmp/p/groups-real.ts
          git show FETCH_HEAD:src/reviewers/deadline.ts > /tmp/p/deadline.ts
          wc -l /tmp/p/*.ts

      - name: Write the probes
        run: |
          cat > /tmp/p/probe.ts <<'EOF'
          import { spawn } from "node:child_process";
          const record = process.argv[2];
          const prefix = `printf '%s\\n' "$$" 2>/dev/null >> "\${SQUIZ_GROUPS:-/dev/null}" || :`;
          const command = process.argv.slice(3).join(" ");
          const child = spawn("/bin/bash", ["-c", `${prefix}\n${command}`], {
            detached: true,
            stdio: ["ignore", "inherit", "inherit"],
            env: { ...process.env, SQUIZ_GROUPS: record, SQUIZ_ROUND: "token-0ddba11-0ddba11-0ddba11" },
          });
          child.unref();
          console.log(`shell pid ${child.pid}`);
          EOF
          cat > /tmp/p/forge.ts <<'EOF'
          import { spawn, spawnSync } from "node:child_process";
          import { mkdtempSync, readFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { makeRoundSpace, recordedGroups, shellPrefix, stopRecordedGroups } from "./groups-real.ts";
          const wait = (ms: number) => new Promise((go) => setTimeout(go, ms));
          const victim = spawn("sleep", ["600"], { detached: true, stdio: "ignore" });
          victim.unref();
          const victimGroup = victim.pid ?? 0;
          const made = makeRoundSpace(mkdtempSync(`${tmpdir()}/i246-`));
          if (made.outcome !== "made") throw new Error(made.reason);
          const space = made.space;
          const command = `printenv SQUIZ_GROUPS; printf '%s\\n' ${victimGroup} >> "$SQUIZ_GROUPS"`;
          const shell = spawn("/bin/bash", ["-c", `${shellPrefix}\n${command}`], {
            detached: true, stdio: ["ignore", "pipe", "inherit"],
            env: { ...process.env, SQUIZ_GROUPS: space.shellRecord },
          });
          let said = "";
          shell.stdout.on("data", (chunk) => (said += String(chunk)));
          await new Promise((done) => shell.on("exit", done));
          await wait(300);
          console.log(`victim group       ${victimGroup} (sleep, nothing of the round's)`);
          console.log(`shell printed      ${said.trim()}`);
          console.log(`record on disk     ${JSON.stringify(readFileSync(space.shellRecord, "utf8"))}`);
          console.log(`recordedGroups     ${JSON.stringify(recordedGroups(space))}`);
          console.log(`victim before      ${spawnSync("ps", ["-o", "pid=,pgid=,etime=,comm=", "-p", String(victimGroup)], { encoding: "utf8" }).stdout.trim() || "(gone)"}`);
          console.log(`stopRecordedGroups ${JSON.stringify(await stopRecordedGroups(space, 2_000))}`);
          await wait(300);
          console.log(`victim after       ${spawnSync("ps", ["-o", "pid=,pgid=,comm=", "-p", String(victimGroup)], { encoding: "utf8" }).stdout.trim() || "(gone)"}`);
          EOF
          ls -l /tmp/p

      - name: A grandchild of a detached shell, and what /proc says about it
        run: |
          cd /tmp/p
          for prog in 'sleep 300' 'node -e "setTimeout(()=>{},300000)"' '/bin/bash -c "while :; do sleep 2; done"'; do
            : > groups
            node probe.ts "$PWD/groups" "$prog >/dev/null 2>&1 & disown; exit 0" >/dev/null
            sleep 2
            G=$(head -1 groups)
            echo "=== $prog : recorded group $G ==="
            echo "leader: $(ps -o pid=,pgid= -p $G | tr -s ' ' || true)"
            echo "ps -o pid=,pgid=,sid=,etime=,comm= -g $G:"; ps -o pid=,pgid=,sid=,etime=,comm= -g $G || echo "  (ps -g found nothing)"
            echo "ps -o pid=,pgid=,sid=,etime=,comm= --pgid $G:"; ps -o pid=,pgid=,sid=,etime=,comm= --pgid $G || echo "  (--pgid found nothing)"
            P=$(ps -o pid= --pgid $G | head -1 | tr -d ' ')
            echo "member $P: /proc/$P/environ"
            ls -l /proc/$P/environ || true
            echo "  bytes=$(cat /proc/$P/environ | wc -c)"
            echo "  token: $(tr '\0' '\n' < /proc/$P/environ | grep '^SQUIZ_ROUND=' || echo '(not readable)')"
            echo "  ps eww bytes=$(ps eww -o pid=,pgid=,command= --pgid $G | wc -c), token hits=$(ps eww -o command= --pgid $G | grep -c SQUIZ_ROUND=token)"
            kill -TERM -$G 2>/dev/null || true
          done

      - name: What ps -g selects on Linux
        run: |
          # A background job in its own process group inside this shell's session.
          out=$(bash -c 'set -m; sleep 120 & echo $!')
          P=$out
          read -r pid pgid sid <<<"$(ps -o pid=,pgid=,sid= -p $P | tr -s ' ' | sed 's/^ //')"
          echo "the job: pid=$pid pgid=$pgid sid=$sid  (pgid differs from sid: $([ "$pgid" != "$sid" ] && echo yes || echo no))"
          echo "--- ps -g \$sid ($sid) ---"; ps -o pid=,pgid=,sid=,comm= -g $sid || echo "(nothing)"
          echo "--- ps -g \$pgid ($pgid) ---"; ps -o pid=,pgid=,sid=,comm= -g $pgid || echo "(nothing)"
          kill $P 2>/dev/null || true

      - name: Can a command standing where the reviewer's shell stands forge a record
        run: cd /tmp/p && node forge.ts

      - name: How fast this machine allocates pids
        run: |
          a=$(bash -c 'echo $$'); t0=$(date +%s)
          i=0; while [ $i -lt 20000 ]; do /bin/true; i=$((i+1)); done
          b=$(bash -c 'echo $$'); t1=$(date +%s)
          echo "one spawning loop: $a -> $b over $((t1-t0))s"
          echo "pid_max=$(cat /proc/sys/kernel/pid_max)"
          awk -v a=$a -v b=$b -v d=$((t1-t0)) -v m=$(cat /proc/sys/kernel/pid_max) \
            'BEGIN { r=(b-a)/d; printf "rate=%.1f/s, seconds to turn the space over=%.0f\n", r, m/r }'
