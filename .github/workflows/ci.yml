name: CI

on:
  pull_request:
  push:
    branches: [main]
  # GitHub sometimes starts no run for a pull request's push, and then reports no
  # checks at all — which reads exactly like a repository that runs none. This is
  # how a run is started by hand for a branch when that happens.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Report the Node version
        run: node --version

      # The tests of src/sessions/ start windows on a tmux server of their own,
      # under each shell tmux may hand a command line to.
      - name: Install tmux and the shells
        run: sudo apt-get update && sudo apt-get install -y tmux zsh fish

      - name: Report the tmux version
        run: tmux -V

      - name: Install development dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test
